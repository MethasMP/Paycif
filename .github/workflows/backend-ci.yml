name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'back-end/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'back-end/**'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: back-end/go.sum

      - name: Verify Dependencies
        run: go mod verify

      - name: Fetch base branch for linter
        run: git fetch origin ${{ github.base_ref }}

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          GOWORK=off $(go env GOPATH)/bin/golangci-lint run --new-from-rev=origin/main --timeout=5m

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

  build-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    strategy:
      matrix:
        service: [verify-service, accounting-core, fx-engine, payload-worker]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: back-end/go.sum

      - name: Build Microservice
        run: go build -o bin/${{ matrix.service }} ./cmd/${{ matrix.service }}
