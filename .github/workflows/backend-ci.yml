name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'back-end/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'back-end/**'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}:origin/${{ github.base_ref }}
        if: github.event_name == 'pull_request'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: back-end/go.sum

      - name: Verify Dependencies
        run: go mod verify

      - name: Download Dependencies
        run: go mod download

      - name: Tidy Dependencies
        run: go mod tidy

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            GOWORK=off $(go env GOPATH)/bin/golangci-lint run --timeout=5m --new-from-rev=origin/${{ github.base_ref }}
          else
            GOWORK=off $(go env GOPATH)/bin/golangci-lint run --timeout=5m
          fi

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

  build-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    strategy:
      matrix:
        service: [verify-service, accounting-core, fx-engine, payload-worker]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}:origin/${{ github.base_ref }}
        if: github.event_name == 'pull_request'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: back-end/go.sum

      - name: Build Microservice
        run: go build -o bin/${{ matrix.service }} ./cmd/${{ matrix.service }}
