name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'back-end/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'back-end/**'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: back-end/go.sum

      - name: Verify Dependencies
        run: go mod verify

      - name: Cache golangci-lint
        uses: actions/cache@v3
        with:
          path: ~/go/bin/golangci-lint
          key: ${{ runner.os }}-golangci-lint-v1.64.5

      - name: Install and Run golangci-lint
        run: |
          if [ ! -f ~/go/bin/golangci-lint ]; then
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5
          fi
          ~/go/bin/golangci-lint run --timeout=5m

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

  build-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    strategy:
      matrix:
        service: [verify-service, accounting-core, fx-engine, payload-worker]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: back-end/go.sum

      - name: Build Microservice
        run: go build -o bin/${{ matrix.service }} ./cmd/${{ matrix.service }}
